[project]
name = "graph-agent"
version = "0.2.0"
description = "基于 LangGraph 的多 Agent 编排框架，支持三层编排、Skill 系统、MCP 协议、人机协作"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # LangChain / LangGraph 核心
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    # LLM Provider
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-ollama>=0.3.0",
    # 配置 / 环境
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    # MCP 协议
    "mcp>=1.0.0",
    # 网页工具 / ACP 客户端
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "aiohttp>=3.10.0",
    # ACP HTTP+SSE 服务
    "fastapi>=0.110.0",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.30.0",
    # 文档生成
    "python-pptx>=0.6.21",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "graph_agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
